name: DevSecOps Pipeline

on:
  push:
  pull_request:

jobs:
  security-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      # Gate 1 - SAST
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Run Semgrep SAST
        run: semgrep scan --config auto .

      # Gate 2 - Dependency scanning
      - name: Set up npm for security audit
        run: npm install -g npm@8.19.4

      - name: Run npm audit security gate
        run: node scripts/audit-gate.js

      # Gate 3 - Secret scanning
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Build hardened production container
      - name: Build Docker image
        run: docker build -t nodegoat:ci .

      # Gate 4 - Container scanning
      - name: Run Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nodegoat:ci'
          format: 'table'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'